name: Firegate Momentum Scanner

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Invia AddFiregate TMO per test"
        required: false
        default: false
        type: boolean

  schedule:
    # Ogni 10 minuti, lun-ven. Lo script controlla anche che il mercato sia aperto.
    # Con repo pubblico puoi cambiare */10 in */5.
    - cron: "*/5 9-16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: firegate-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui scanner
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram && 'true' || 'false' }}

          # Puoi modificare queste soglie in seguito.
          MIN_CHANGE: "4.0"
          MIN_MARKET_CAP: "2000000000"
          MIN_AVG_DOLLAR_VOLUME: "20000000"
          MIN_RVOL_PACE: "1.8"
          TOP_MOVERS: "50"
        run: python scanner.py

      - name: Salva stato anti-duplicati e cache market cap
        if: always()
        run: |
          git config user.name "firegate-scanner"
          git config user.email "firegate-scanner@users.noreply.github.com"

          touch alerts_state.json market_caps.json
          git add alerts_state.json market_caps.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi

          git commit -m "Update scanner state [skip ci]"
          git push
