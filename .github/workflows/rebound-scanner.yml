name: FireGate Rebound Scanner

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Invia AddFiregate AAPL per test"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Analizza senza inviare Telegram"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "2/5 9-15 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: firegate-rebound-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installa dipendenze
        run: pip install -r requirements_rebound.txt

      - name: Verifica sintassi
        run: python -m py_compile rebound_scanner.py

      - name: Esegui rebound scanner
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram && 'true' || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          TOP_LOSERS: "50"
          MAX_ALERTS_PER_RUN: "5"
          MIN_MARKET_CAP: "2000000000"
          MIN_AVG_DOLLAR_VOLUME: "20000000"
          MIN_PRICE: "5"
          MIN_DROP_PCT: "3.0"
          MAX_DROP_PCT: "15.0"
          MIN_SCORE: "9.0"
          COOLDOWN_HOURS: "6"
          REALERT_SCORE_GAIN: "2.0"
          MAX_WORKERS: "5"
        run: python rebound_scanner.py

      - name: Salva stato e cache
        if: always()
        run: |
          git config user.name "firegate-rebound-scanner"
          git config user.email "firegate-rebound-scanner@users.noreply.github.com"
          touch rebound_alerts_state.json rebound_meta_cache.json
          git add rebound_alerts_state.json rebound_meta_cache.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Update rebound scanner state [skip ci]"
          git pull --rebase
          git push
